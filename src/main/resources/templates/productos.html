<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Productos</title>
<link rel="stylesheet"
	th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/css/styles.css}">
<link rel="stylesheet" th:href="@{/css/forms.css}">
<link rel="stylesheet" th:href="@{/css/footer.css}">
<link rel="stylesheet"
	th:href="@{/webjars/fontawesome/css/font-awesome.min.css}"></link>
</head>
<body>
	<div th:replace="layout/navbar.html :: navbar"></div>
	<!-- style="text-align: justify;" -->
	<div class="container-fluid">
		<div class="col-xs-12" style="height: 30px;"></div>
		<h2>GESTION DE PRODUCTOS</h2>
		<a th:href="@{/producto}" class="btn btn-success" id="delRef">Agregar
			<i class="fa fa-plus"></i>
		</a> <a th:href="@{/producto/ultimo}" class="btn btn-danger" id="delRef">Ultimo
			producto</a>
		<div class="row">
			<div class="col-12">
				<table class="table table-bordered table-responsive p-3">
					<thead class="thead-dark">
						<tr class="text-center">
							<th style="width: 6%">ID</th>
							<th>Nombre</th>
							<th>Marca</th>
							<th>Descripción</th>
							<th style="width: 10%">Imagen</th>
							<th style="width: 11%">Precio</th>
							<th>Stock</th>
							<th style="width: 10%">Vender</th>
							<th style="width: 9%">Editar</th>
							<th style="width: 10%">Eliminar</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="producto : ${productos}">
							<td th:text="${producto.codigo}"></td>
							<td th:text="${producto.nombre}"></td>
							<td th:text="${producto.marca}"></td>
							<td th:text="${producto.descripcion}"></td>
							<td><img class="card-img-top m-auto"
								th:src="*{'data:image/png;base64,'+producto.imagen}"></td>
							<td>$ <span
								th:text="${#numbers.formatDecimal(producto.precio, 0, 'COMMA', 2, 'POINT')}">10.00</span></td>
							<td th:text="${producto.stock}"></td>
							<td><a th:href="@{/comprar/{id}(id=${producto.codigo})}"
								class="btn btn-primary" id="buyRef">Vender<i
									class="fa fa-shopping-cart"></i></a></td>
							<td><a
								th:href="@{/producto/modificar/{id}(id=${producto.codigo})}"
								class="btn btn-warning">Editar<i class="fa fa-edit"></i></a></td>
							<td><a data-toggle="modal"
								data-target="#removeProductoModal" class="btn btn-danger delBtn"
								th:attr="data-target='#removeProductoModal'+${producto.codigo}">Eliminar
									<i class="fa fa-trash"></i>
							</a> <!-- #Modal for removing Producto -->
								<div class="modal fade"
									th:id="removeProductoModal+${producto.codigo}"
									id="removeProductoModal" tabindex="-1" role="dialog"
									aria-labelledby="removeModalCenterTitle" aria-hidden="true">
									<div class="modal-dialog modal-dialog-centered" role="document">
										<div class="modal-content">
											<div class="modal-header">
												<h4 class="modal-title" id="removeModalCenterTitle">ELIMINAR
													PRODUCTO</h4>
												<button type="button" class="close" data-dismiss="modal"
													aria-label="Close">
													<span aria-hidden="true">&times;</span>
												</button>
											</div>
											<div class="modal-body">
												<p class="alert alert-danger">
													Seguro que desea eliminar el producto <span
														th:text="${producto.nombre}"></span>?
												</p>
											</div>
											<div class="modal-footer">
												<a th:href="@{/delete/{id}(id=${producto.codigo})}"
													class="btn btn-danger" id="delRef">Aceptar</a>
												<button type="button" class="btn btn-secondary"
													data-dismiss="modal">Cancelar</button>
											</div>
										</div>
									</div>
								</div></td>
						</tr>
					</tbody>
				</table>
				<!-- Pagination -->
				<div class="row">
					<div class="col-md-2"></div>
					<div class="col-md-8">
						<nav aria-label="Pagination">
							<ul class="pagination justify-content-center">
								<li class="page-item"
									th:classappend="${prev == 0 ? 'disabled': ''}"><a
									class="page-link" th:href="@{|/productos/?page=${prev}|}">Anterior</a></li>
								<li class="page-item" th:each="page : ${pages}"
									th:classappend="${current == page ? 'active': ''}"><a
									class="page-link" th:href="@{|/productos/?page=${page}|}"
									th:text="${page}"></a></li>
								<li class="page-item"
									th:classappend="${current == last ? 'disabled': ''}"><a
									class="page-link" th:href="@{|/productos/?page=${next}|}">Siguiente</a></li>
							</ul>
						</nav>
					</div>
					<div class="col-md-2"></div>
				</div>
			</div>
		</div>
	</div>
	<div th:replace="layout/footer :: footer"></div>
	</script>
</body>
<script th:src="@{/webjars/jquery/jquery.min.js}"></script>
<script th:src="@{/webjars/popper.js/umd/popper.min.js}"></script>
<script th:src="@{/webjars/bootstrap/js/bootstrap.min.js}"></script>
</html>
